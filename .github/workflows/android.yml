name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "custom-app"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Prepare test build
        run: |
          touch local.properties
          : > keystore.properties
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest --warning-mode all

      - name: Run Android lint
        run: ./gradlew lintGithubDebug --warning-mode all

      - name: Build Hammel test APK
        run: ./gradlew assembleGithubDebug --warning-mode all

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-universal-test-APK
          path: ${{ env.main_project_module }}/build/outputs/apk/github/debug/*universal*.apk

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-all-test-APKs
          path: ${{ env.main_project_module }}/build/outputs/apk/github/debug/
