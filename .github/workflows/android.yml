name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "custom-app"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Prepare build
        run: |
          touch local.properties
          : > keystore.properties
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest --warning-mode all

      - name: Run Android lint
        continue-on-error: true
        run: ./gradlew lintGithubDebug --warning-mode all

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-lint-report
          path: |
            ${{ env.main_project_module }}/build/reports/lint-results-githubDebug.html
            ${{ env.main_project_module }}/build/intermediates/lint_intermediate_text_report/githubDebug/lintReportGithubDebug/lint-results-githubDebug.txt

      - name: Build Hammel debug APK
        run: ./gradlew assembleGithubDebug --warning-mode all

      - name: Build Hammel unsigned release APK
        run: ./gradlew assembleGithubRelease --warning-mode all

      - name: Upload universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-universal-test-APK
          path: ${{ env.main_project_module }}/build/outputs/apk/github/debug/*universal*.apk

      - name: Upload universal unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-universal-unsigned-release-APK
          path: ${{ env.main_project_module }}/build/outputs/apk/github/release/*universal*.apk

      - name: Upload all release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-all-unsigned-release-APKs
          path: ${{ env.main_project_module }}/build/outputs/apk/github/release/
