name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  push:
    branches:
      - "custom-app"
  pull_request:
    branches:
      - "custom-app"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Prepare test build
        run: |
          touch local.properties
          : > keystore.properties
          chmod +x gradlew

      - name: Refuse release builds without the retained signing key
        run: |
          if ./gradlew :app:preGithubReleaseBuild > signing-check.txt 2>&1; then
            echo "Release incorrectly accepted a disposable signing key"
            exit 1
          fi
          grep -q 'Release blocked: provide the retained Hammel signing key' signing-check.txt

      - name: Run unit tests
        run: ./gradlew testGithubDebugUnitTest --warning-mode all

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-unit-test-results
          path: app/build/test-results/testGithubDebugUnitTest/*.xml

      - name: Run Android lint
        continue-on-error: true
        run: ./gradlew lintGithubDebug --warning-mode all

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-lint-report-${{ github.event_name }}
          path: |
            ${{ env.main_project_module }}/build/reports/lint-results-*.html
            ${{ env.main_project_module }}/build/intermediates/lint_intermediate_text_report/**/lint-results-*.txt

      - name: Build Hammel test APK
        run: ./gradlew assembleGithubDebug assembleGithubDebugAndroidTest --warning-mode all

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-universal-test-APK
          path: ${{ env.main_project_module }}/build/outputs/apk/github/debug/*universal*.apk

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-all-test-APKs
          path: ${{ env.main_project_module }}/build/outputs/apk/github/debug/

      - name: Enable KVM for interface verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify interface and capture real app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 1080x1920
          script: |
            adb install -g app/build/outputs/apk/github/debug/*universal*.apk
            adb shell run-as com.nashmi233.downloader mkdir -p shared_prefs
            printf '%s' '<map><boolean name="asked_auto_update_preferences" value="true"/><boolean name="update_app" value="false"/><boolean name="auto_update_ytdlp" value="false"/></map>' | adb shell run-as com.nashmi233.downloader sh -c '"cat > shared_prefs/com.nashmi233.downloader_preferences.xml"'
            python3 scripts/capture-screenshots.py
            adb install -g app/build/outputs/apk/androidTest/github/debug/*.apk
            adb shell am instrument -w -e class com.deniscerri.ytdl.DownloadPresentationTest,com.deniscerri.ytdl.ExampleInstrumentedTest com.nashmi233.downloader.test/androidx.test.runner.AndroidJUnitRunner | tee screenshots/instrumentation.txt
            grep -q 'OK (' screenshots/instrumentation.txt
            adb shell am instrument -w -e class com.deniscerri.ytdl.DownloadPresentationTest#seedScreenshotFixture com.nashmi233.downloader.test/androidx.test.runner.AndroidJUnitRunner | tee screenshots/fixture.txt
            grep -q 'OK (' screenshots/fixture.txt
            python3 scripts/capture-download-presentation.py

      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hammel-interface-screenshots
          path: screenshots/
