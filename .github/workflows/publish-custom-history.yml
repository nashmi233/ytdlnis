name: Publish Hammel Custom History

on:
  push:
    branches:
      - "play-release"
    paths:
      - ".github/workflows/publish-custom-history.yml"

permissions:
  contents: write

jobs:
  publish-first-custom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout first custom milestone
        uses: actions/checkout@v4
        with:
          ref: 6d146563cbc6d9b3c140f0e1529b31e9633d2399
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Prepare build
        run: |
          touch local.properties
          : > keystore.properties
          chmod +x gradlew

      - name: Build first custom test APK
        run: ./gradlew assembleGithubDebug --warning-mode all

      - name: Collect universal APK
        run: |
          mkdir -p release-first
          cp app/build/outputs/apk/github/debug/*universal*.apk release-first/

      - name: Publish first custom prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hammel-1.8.9.2-first-custom"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" release-first/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "6d146563cbc6d9b3c140f0e1529b31e9633d2399" \
            --title "حمّل 1.8.9.2 - أول نسخة معدلة" \
            --notes "أول معلم محفوظ لنسخة حمّل المعدلة. نسخة تجريبية Debug للاختبار وليست نسخة Google Play النهائية الموقعة. المشروع مبني على YTDLnis مفتوح المصدر وتبقى إشعارات وترخيص GPL الأصلية محفوظة." \
            --prerelease

  publish-latest-play-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest Play branch
        uses: actions/checkout@v4
        with:
          ref: play-release
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: corretto
          cache: gradle

      - name: Prepare build
        run: |
          touch local.properties
          : > keystore.properties
          chmod +x gradlew

      - name: Run Play tests
        run: ./gradlew testFossDebugUnitTest --warning-mode all

      - name: Build latest Play test APK
        run: ./gradlew assembleFossDebug --warning-mode all

      - name: Collect universal APK
        run: |
          mkdir -p release-latest
          cp app/build/outputs/apk/foss/debug/*universal*.apk release-latest/

      - name: Publish latest modified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hammel-1.8.9.2-play-preview.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" release-latest/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "play-release" \
            --title "حمّل 1.8.9.2 - أحدث نسخة معدلة (Play Preview)" \
            --notes "أحدث نسخة معدلة ومختبرة من فرع Google Play. تتضمن تحسين مسار المشاركة والتنزيل السريع وتقليل الصلاحيات وتعطيل التحديث الذاتي غير المناسب لنسخة المتجر. هذه Preview تجريبية وليست AAB/Release النهائية الموقعة للمتجر." \
            --prerelease
