name: Publish tested Hammel 1.8.9.5

on:
  push:
    branches: [custom-app]
    paths: [.github/workflows/publish-hammel-1.8.9.5.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-hammel-1.8.9.5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: nashmi233/ytdlnis
      TAG: hammel-1.8.9.5-test.1
      RELEASE_COMMIT: f0c7fe3b038c6618959fc5f0ae8095e46fc3e0d4
      TESTED_COMMIT: 9215ab9b17188aea826487c649f16e17e0490d5f
      TESTED_RUN: '43948396335'
      APK: release-assets/NashmiDownloader-1.8.9.5-universal-debug.apk
    steps:
      - name: Verify tested source and download the exact APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$TESTED_RUN" --jq '.status + ":" + .conclusion + ":" + .head_sha')" = "completed:success:$TESTED_COMMIT"
          gh api "repos/$GH_REPO/compare/$TESTED_COMMIT...$RELEASE_COMMIT" > comparison.json
          python3 - <<'PYCODE'
          import json, re
          comparison = json.load(open('comparison.json'))
          assert comparison['status'] in ('ahead', 'identical')
          allowed = r'(README[^/]*\.md|CHANGELOG\.md|CONTRIBUTING\.MD|SECURITY\.md|PRIVACY\.md|docs/(screenshots/[^/]+\.png|VALIDATION-1\.8\.9\.5\.md)|fastlane/metadata/android/en-US/(title|short_description|full_description)\.txt)'
          assert all(re.fullmatch(allowed, f['filename']) or (f['filename'] == '.github/workflows/tg-bot.yml' and f['status'] == 'removed') for f in comparison.get('files', [])), 'Application source changed after testing'
          PYCODE
          gh run download "$TESTED_RUN" --name Hammel-universal-test-APK --dir release-assets
          echo "fe30ac836be953a8ce05f6ab4b42ef8745682e306905dcc9c0d2a63c75cd89f8  $APK" | sha256sum --check
      - name: Publish the tested APK as a prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## حمّل 1.8.9.5
          - خلفية سوداء للتطبيق والشعار داخل الواجهة.
          - خيارات الرابط المنسوخ والتنزيل التلقائي والاستوديو ونوع تنزيل تيك توك مباشرة في «المزيد».
          - إزالة اختصارات سطر الأوامر والسجلات وقوالب الأوامر من «المزيد».
          - تنظيف «حول» من روابط Discord وTelegram والترجمة، وإضافة اسم نشمي ورقم النسخة.
          - توثيق واضح وصور فعلية للواجهة وسياسة خصوصية خاصة بحمّل.

          **التحقق:** 43 اختبارًا ناجحًا، وبناء APK ناجح. فحص Android Lint ما زال يسجل 30 خطأ مطابقة للنسخة السابقة، دون أخطاء جديدة؛ لم يُعتبر الفحص نظيفًا. فُحصت الواجهة على محاكي أندرويد، بما يشمل حفظ إعداد التنزيل بعد إعادة تشغيل التطبيق.
          هذا هو نفس الملف الذي اجتاز الفحص، ولم يُعد بناؤه عند النشر.

          **نسخة تجريبية (Debug).** التحديث فوق نسخة موجودة يحتاج تطابق توقيع التثبيت. لم يُختبر التثبيت على جهاز المستخدم؛ إذا رفض أندرويد التحديث فلا تحذف النسخة القديمة حفاظًا على بياناتك.

          SHA-256:
          `fe30ac836be953a8ce05f6ab4b42ef8745682e306905dcc9c0d2a63c75cd89f8`

          [سجل الاختبارات والبناء](https://github.com/nashmi233/ytdlnis/actions/runs/43948396335)
          NOTES
          gh release create "$TAG" "$APK" --target "$RELEASE_COMMIT" --title "حمّل 1.8.9.5 — واجهة سوداء وخيارات تنزيل مباشرة" --notes-file release-notes.md --draft --prerelease
          gh release edit "$TAG" --draft=false --prerelease
          gh release view "$TAG" --json url,assets,isPrerelease
