name: Publish tested Hammel 1.8.9.4

on:
  push:
    branches: [custom-app]
    paths: [.github/workflows/publish-hammel-1.8.9.4.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-hammel-1.8.9.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: nashmi233/ytdlnis
      TAG: hammel-1.8.9.4-test.1
      RELEASE_COMMIT: d3b98c81c6f45b203476f62f091cb5a2fbaa3ff6
      TESTED_COMMIT: ee23c2d5996639db5612adee05e27965ddc63025
      TESTED_RUN: '43943806488'
      APK: release-assets/NashmiDownloader-1.8.9.4-universal-debug.apk
    steps:
      - name: Verify tested source and download the exact APK
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$TESTED_RUN" --jq '.status + ":" + .conclusion + ":" + .head_sha')" = "completed:success:$TESTED_COMMIT"
          test "$(gh api "repos/$GH_REPO/git/commits/$RELEASE_COMMIT" --jq '.tree.sha')" = "$(gh api "repos/$GH_REPO/git/commits/$TESTED_COMMIT" --jq '.tree.sha')"
          gh run download "$TESTED_RUN" --name Hammel-universal-test-APK --dir release-assets
          echo "e286dd33766eaee8ce285820c4369695465ff05e8b7e734e28a8f5599e2fcb2c  $APK" | sha256sum --check
      - name: Publish the tested APK as a prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to overwrite it."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          ## حمّل 1.8.9.4
          - اعتماد الشعار البنفسجي الجديد المختار (رقم 5) في الأيقونة والواجهة.
          - إصلاح مسار تحديث التطبيق ومنع عرض النسخة نفسها أو نسخة أقدم.
          - التحقق من هوية ملف APK وإصداره وتوقيعه قبل تثبيت التحديث.
          - مشاركة رابط فيديو إلى حمّل تبدأ تنزيله تلقائيًا، بما فيها روابط تيك توك والمنصات المدعومة.
          - تحسين استقبال الروابط والأذونات دون اشتراط الظهور فوق التطبيقات.

          **التحقق:** 43 اختبارًا ناجحًا، وفحص Android lint ناجح، وبناء APK ناجح.
          هذا هو نفس الملف الذي اجتاز الفحص، ولم يُعد بناؤه عند النشر.

          **نسخة تجريبية (Debug).** التحديث فوق نسخة موجودة يحتاج تطابق توقيع التثبيت. لم يُختبر التثبيت على جهاز المستخدم؛ إذا رفض أندرويد التحديث فلا تحذف النسخة القديمة حفاظًا على بياناتك.

          SHA-256:
          `e286dd33766eaee8ce285820c4369695465ff05e8b7e734e28a8f5599e2fcb2c`

          [سجل الاختبارات والبناء](https://github.com/nashmi233/ytdlnis/actions/runs/43943806488)
          NOTES
          gh release create "$TAG" "$APK" --target "$RELEASE_COMMIT" --title "حمّل 1.8.9.4 — الشعار الجديد والتحديث والمشاركة" --notes-file release-notes.md --draft --prerelease
          gh release edit "$TAG" --draft=false --prerelease
          gh release view "$TAG" --json url,assets,isPrerelease
