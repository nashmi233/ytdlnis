plugins {
    id 'com.android.application'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin' version '2.0.1'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id "org.jetbrains.kotlin.plugin.serialization" version "2.3.0"
    id "org.jetbrains.kotlin.plugin.parcelize" version "2.3.0"
    id "org.jetbrains.kotlin.plugin.compose" version "2.3.0"
}

def properties = new Properties()
def signingPropertiesFile = rootProject.file("keystore.properties")
def hasReleaseSigning = false
if (signingPropertiesFile.exists() && signingPropertiesFile.text.trim()) {
    properties.load(new FileInputStream(signingPropertiesFile))
    hasReleaseSigning = [
        "signingConfig.storeFile",
        "signingConfig.storePassword",
        "signingConfig.keyAlias",
        "signingConfig.keyPassword"
    ].every { properties[it] != null && properties[it].toString().trim() }
}

def versionMajor = 1
def versionMinor = 8
def versionPatch = 9
def versionBuild = 2 // bump for dogfood builds, public betas, etc.
//WHEN RELEASING BETA KEEP THE SAME VERSION AS LATEST STABLE, SO USERS CAN DOWNGRADE
def isBeta = false

def versionExt = ""
if (versionBuild > 0) {
    versionExt += ".${versionBuild}"
}
if (isBeta) {
    versionExt += "-beta"
}

android {
    namespace 'com.deniscerri.ytdl'
    compileSdk = 36

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(properties["signingConfig.storeFile"])
                storePassword properties["signingConfig.storePassword"]
                keyAlias properties["signingConfig.keyAlias"]
                keyPassword properties["signingConfig.keyPassword"]
            }
        }
    }

    defaultConfig {
        applicationId "com.nashmi233.downloader"
        minSdk 24
        targetSdk 36
        versionCode versionMajor * 1000000 + versionMinor * 10000 + versionPatch * 100 + versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionPatch}${versionExt}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        archivesBaseName = "NashmiDownloader-$versionName"
        vectorDrawables {
            useSupportLibrary true
        }

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }

        vectorDrawables.generatedDensities = []

    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            debuggable true
        }
    }

    flavorDimensions "version"
    productFlavors {
        github {
            dimension "version"
            isDefault true
        }
        foss {
            dimension "version"
        }
        izzy {
            dimension "version"
        }
    }


    android.applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            def baseAbiVersionCode = project.abiCodes.get(output.getFilter(com.android.build.OutputFile.ABI))
            if (baseAbiVersionCode != null) {
                output.versionCodeOverride = (100 * project.android.defaultConfig.versionCode) + baseAbiVersionCode
            } else {
                output.versionCodeOverride = 100 * project.android.defaultConfig.versionCode
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':common')
    implementation project(':library')
    implementation project(':ffmpeg')

    implementation libs.androidx.appcompat
